<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0b0820" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Seiya Snap" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <title>Saint Seiya Snap</title>
  </head>
  <body>
    <svg aria-hidden="true" width="0" height="0" style="position: absolute">
      <defs>
        <filter
          id="algol-petrify-threshold"
          x="-8%"
          y="-8%"
          width="116%"
          height="116%"
          color-interpolation-filters="sRGB"
        >
          <feColorMatrix
            in="SourceGraphic"
            type="matrix"
            values="
              0.2126 0.7152 0.0722 0 0
              0.2126 0.7152 0.0722 0 0
              0.2126 0.7152 0.0722 0 0
              0 0 0 1 0"
            result="lum"
          />
          <feComponentTransfer in="lum" result="thresh">
            <feFuncR type="discrete" tableValues="0.06 0.06 0.48 0.48 0.88 0.88" />
            <feFuncG type="discrete" tableValues="0.06 0.06 0.48 0.48 0.88 0.88" />
            <feFuncB type="discrete" tableValues="0.06 0.06 0.48 0.48 0.88 0.88" />
          </feComponentTransfer>
          <feColorMatrix
            in="thresh"
            type="matrix"
            values="
              0.42 0 0 0 0.06
              0 0.40 0 0 0.05
              0 0 0.38 0 0.04
              0 0 0 1 0"
          />
        </filter>
      </defs>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
